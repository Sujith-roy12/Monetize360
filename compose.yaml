services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monetize360
      POSTGRES_USER: monetize360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - pricing_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U monetize360 -d monetize360"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://monetize360:${POSTGRES_PASSWORD:-local-demo-password}@db:5432/monetize360
      ADMIN_TOKEN: ${ADMIN_TOKEN:-monetize360-publisher}
      EDITOR_TOKEN: ${EDITOR_TOKEN:-monetize360-editor}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  pricing_data:
